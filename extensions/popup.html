<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Video Transcript Chat</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Top bar: app title + video ID input -->
  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Transcript Chat</h1>
    </div>

    <div class="video-row">
      <input id="videoIdInput" type="text" placeholder="YouTube video ID" />
      <button id="loadBtn">
        <span class="btn-label">Load</span>
        <span class="btn-spinner" id="loadSpinner"></span>
      </button>
    </div>

    <p id="status">Paste a video ID to get started</p>
  </header>

  <!-- Chat messages appear here -->
  <main id="chatWindow">
    <div class="empty-state" id="emptyState">
      <p>Load a video, then ask anything about it</p>
    </div>
  </main>

  <!-- Bottom bar: ask a question -->
  <footer>
    <input id="questionInput" type="text" placeholder="Ask a question..." disabled />
    <button id="askBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
      </svg>
    </button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
