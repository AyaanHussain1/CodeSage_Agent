<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Project Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Project Chat</h1>
    </div>

    <!-- Hidden native input does the actual folder picking; the button just triggers it -->
    <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
    <button id="openFolderBtn">Open Folder</button>
    <button id="indexBtn" disabled>Index Project</button>
    <span id="status">No folder open</span>
  </header>

  <div class="body">
    <aside id="fileTree">
      <p class="hint">Open a folder to browse files</p>
    </aside>

    <div class="resize-handle" id="resizeLeft"></div>

    <section id="filePreview">
      <p class="hint">Click a file to preview it here</p>
    </section>

    <div class="resize-handle" id="resizeRight"></div>

    <aside id="chatPanel">
      <main id="chatWindow">
        <div class="empty-state" id="emptyState">
          <p>Index the project, then ask about your code</p>
        </div>
      </main>
      <footer>
        <input id="questionInput" type="text" placeholder="Ask about your project..." disabled />
        <button id="askBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
          </svg>
        </button>
      </footer>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
